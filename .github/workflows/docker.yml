name: docker

# Lints, builds, and vulnerability-scans the CPU image, and produces an
# SBOM artifact. The GPU Dockerfile is linted but not built: its base
# image is multi-GB and a CPU build exercises the identical COPY/install
# layer structure.
on:
  pull_request:
    paths:
      - "docker/**"
      - "Dockerfile"
      - ".dockerignore"
      - "requirements.txt"
      - "pyproject.toml"
      - ".github/workflows/docker.yml"
  push:
    branches: [main]
    paths:
      - "docker/**"
      - "Dockerfile"
      - ".dockerignore"
      - "requirements.txt"
      - "pyproject.toml"
      - ".github/workflows/docker.yml"
  schedule:
    - cron: "45 4 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  hadolint:
    name: hadolint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # failure-threshold error: hard errors fail the gate now; style and
      # warning findings surface in the log and tighten later. These
      # Dockerfiles have never been linted before - a stricter threshold
      # unverified against them would be an unmeasured gate.
      - name: Lint CPU Dockerfile
        uses: hadolint/hadolint-action@2a66e89f53d0771bb131a7fa31f3136336094aa6 # v3.4.0
        with:
          dockerfile: docker/Dockerfile.cpu
          failure-threshold: error

      - name: Lint GPU Dockerfile
        uses: hadolint/hadolint-action@2a66e89f53d0771bb131a7fa31f3136336094aa6 # v3.4.0
        with:
          dockerfile: docker/Dockerfile.gpu
          failure-threshold: error

      - name: Lint root Dockerfile
        uses: hadolint/hadolint-action@2a66e89f53d0771bb131a7fa31f3136336094aa6 # v3.4.0
        with:
          dockerfile: Dockerfile
          failure-threshold: error

  build-scan:
    name: build + trivy + sbom (cpu)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: hadolint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build CPU image (local, not pushed)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/Dockerfile.cpu
          load: true
          tags: vin-ocr:ci-cpu
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy scan (fail on CRITICAL/HIGH with fixes available)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: vin-ocr:ci-cpu
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: vin-ocr:ci-cpu
          format: spdx-json
          output-file: sbom-cpu.spdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-cpu
          path: sbom-cpu.spdx.json
          if-no-files-found: error
