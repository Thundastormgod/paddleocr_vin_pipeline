name: paddle smoke

# Trains the real backend on a synthetic micro-dataset and proves the
# trainer RUNS and LEARNS (loss falls, checkpoints exist, resume
# restores). Previously weekly-only; now it also gates every PR that
# touches the training stack, so a trainer-breaking change cannot merge
# on the strength of unit tests alone.
on:
  pull_request:
    paths:
      - "src/vin_ocr/training/**"
      - "src/vin_ocr/preprocessing/**"
      - "configs/**"
      - "scripts/train_smoke_test.py"
      - ".github/workflows/paddle-smoke.yml"
      - ".github/requirements-ci.txt"
  push:
    branches: [main]
    paths:
      - "src/vin_ocr/training/**"
      - "src/vin_ocr/preprocessing/**"
      - "configs/**"
      - "scripts/train_smoke_test.py"
      - ".github/workflows/paddle-smoke.yml"
      - ".github/requirements-ci.txt"
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  PIP_CONSTRAINT: .github/requirements-ci.txt

jobs:
  paddle-smoke:
    name: paddle training smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/requirements-ci.txt

      - name: Install training backend
        run: |
          python -m pip install --upgrade pip
          pip install \
            paddlepaddle \
            numpy opencv-python-headless Pillow pyyaml rapidfuzz tqdm mlflow

      - name: Run training smoke test
        run: python scripts/train_smoke_test.py
