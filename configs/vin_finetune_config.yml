# =============================================================================
# VIN Recognition Fine-Tuning Config
# =============================================================================
# Consumed by: src/vin_ocr/training/finetune_paddleocr.py
#
# IMPORTANT - scope of this file:
#   This trainer builds its own paddle.nn networks (see VINRecognitionModel /
#   PPOCRv5RecognitionModel). It does NOT drive PaddleOCR's tools/train.py and
#   does NOT load PaddleOCR's model zoo. Only the keys documented below are
#   read; anything else is ignored.
#
#   In particular there is no `transforms:` pipeline here — image
#   preprocessing and augmentation are implemented in code, in
#   VINRecognitionDataset._preprocess_image() and ._augment().
#
# Architecture / Loss / PostProcess must stay mutually consistent. The trainer
# validates this at startup and raises if they disagree.
# =============================================================================

Global:
  debug: false
  # Requested device. Actual device is confirmed by HardwareDetector at runtime;
  # if no CUDA GPU is present this silently falls back to CPU.
  use_gpu: false
  epoch_num: 30
  log_smooth_window: 20
  print_batch_step: 10
  save_model_dir: ./output/vin_rec_finetune
  save_epoch_step: 5
  eval_batch_step: [0, 500]
  cal_metric_during_train: true
  # Path prefix WITHOUT the .pdparams suffix, e.g. ./output/vin_rec_finetune/best_accuracy
  pretrained_model: null
  checkpoints: null
  save_inference_dir: ./inference/vin_rec
  use_visualdl: true
  visualdl_log_dir: ./output/vdl_logs
  infer_img: null
  # 34 entries: '<blank>' at index 0 (CTC blank) + 33 valid VIN characters.
  character_dict_path: ./configs/vin_dict.txt
  max_text_length: 17
  infer_mode: false
  use_space_char: false
  distributed: false
  save_res_path: ./output/rec_results.txt
  use_amp: false
  # Early stopping (evaluated per epoch on validation exact-match accuracy)
  early_stopping: true
  early_stopping_patience: 25
  early_stopping_min_delta: 0.001

Optimizer:
  # Supported: Adam | AdamW | Momentum (alias SGD)
  name: Adam
  beta1: 0.9
  beta2: 0.999
  lr:
    # Supported: Cosine | Step | Piecewise | Const
    name: Cosine
    learning_rate: 0.001
    T_max: 30                 # cosine period, in epochs
    eta_min: 0.0
    # Linear warmup ramps warmup_start_lr -> learning_rate over warmup_epoch
    # epochs. warmup_start_lr is absolute, NOT a fraction of learning_rate.
    warmup_epoch: 5
    warmup_start_lr: 1.0e-06
  regularizer:
    name: L2
    factor: 0.00001

Architecture:
  # PaddleOCR task type. Informational only for this trainer.
  model_type: rec
  # THE selector. Supported: PP-OCRv4 | PP-OCRv5
  #   PP-OCRv4 -> PPLCNetV3 backbone + SVTR encoder + CTC head
  #   PP-OCRv5 -> PPHGNetV2 backbone + SVTR encoder + CTC head
  algorithm: PP-OCRv4
  Backbone:
    name: PPLCNetV3
  Neck:
    name: SVTREncoder
    hidden_dim: 256
    # Read by SVTREncoder via Architecture.Neck.Transformer.*
    Transformer:
      num_heads: 8
      num_layers: 2
      dropout: 0.1
  Head:
    name: CTCHead
    dropout: 0.1

Loss:
  # Supported: CTCLoss | CrossEntropyLoss
  # CTCLoss is the default: it handles sequence alignment natively and is the
  # better performer on this dataset. Must pair with PostProcess CTCLabelDecode.
  name: CTCLoss

PostProcess:
  # CTCLabelDecode  <-> Loss: CTCLoss
  # SARLabelDecode  <-> Loss: CrossEntropyLoss
  name: CTCLabelDecode
  character_dict_path: ./configs/vin_dict.txt
  use_space_char: false

Metric:
  name: RecMetric
  main_indicator: acc
  ignore_space: true

Train:
  dataset:
    name: SimpleDataSet
    data_dir: ./finetune_data/
    label_file_list:
      - ./finetune_data/train_labels.txt
  loader:
    shuffle: true
    batch_size_per_card: 16
    drop_last: true
    num_workers: 0
    use_shared_memory: false

Eval:
  dataset:
    name: SimpleDataSet
    data_dir: ./finetune_data/
    label_file_list:
      - ./finetune_data/val_labels.txt
  loader:
    shuffle: false
    drop_last: false
    batch_size_per_card: 16
    num_workers: 0
    use_shared_memory: false

Test:
  dataset:
    name: SimpleDataSet
    data_dir: ./finetune_data/
    label_file_list:
      - ./finetune_data/test_labels.txt
  loader:
    shuffle: false
    drop_last: false
    batch_size_per_card: 16
    num_workers: 0
    use_shared_memory: false
