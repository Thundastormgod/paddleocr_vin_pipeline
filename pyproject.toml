[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "paddleocr-vin-pipeline"
version = "1.0.0"
description = "Professional VIN OCR Pipeline using PaddleOCR with fine-tuning, ONNX export, and web UI"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "VIN OCR Team", email = "team@example.com"}
]
maintainers = [
    {name = "VIN OCR Team", email = "team@example.com"}
]
keywords = [
    "ocr",
    "vin",
    "paddleocr",
    "vehicle-identification",
    "deep-learning",
    "computer-vision",
    "onnx",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
requires-python = ">=3.10"
dependencies = [
    "paddlepaddle>=3.0.0",
    "paddleocr>=2.9.0",
    "numpy>=1.24.0",
    "opencv-python>=4.8.0",
    "Pillow>=10.0.0",
    "pyyaml>=6.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
web = [
    "streamlit>=1.30.0",
    "plotly>=5.18.0",
    "pandas>=2.0.0",
]
training = [
    # NOTE: visualdl was declared here but is never imported anywhere in the
    # codebase, and the Global.use_visualdl / visualdl_log_dir config keys are
    # not read. Removed rather than shipping an inert dependency; re-add it
    # together with an actual LogWriter integration.
    "optuna>=3.5.0",
]
tracking = [
    # Experiment tracking with mandatory provenance (src/vin_ocr/tracking).
    #
    # Only the SINK needs MLflow. Provenance capture itself (git state,
    # environment, dataset fingerprints) is stdlib + PyYAML, so the ability to
    # answer "what code and what data produced this number" never depends on
    # an optional package being present.
    #
    # >=3.1 for the LoggedModel entity, model_id-linked metrics and
    # tracing spans (traces + model registry both require MLflow 3).
    "mlflow>=3.1",
]
onnx = [
    "onnx>=1.15.0",
    "onnxruntime>=1.16.0",
    "paddle2onnx>=1.2.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.1.0",
    "mypy>=1.7.0",
    "pre-commit>=3.6.0",
]
all = [
    "paddleocr-vin-pipeline[web,training,onnx,tracking,dev]",
]

[project.urls]
Homepage = "https://github.com/Thundastormgod/paddleocr_vin_pipeline"
Documentation = "https://github.com/Thundastormgod/paddleocr_vin_pipeline#readme"
Repository = "https://github.com/Thundastormgod/paddleocr_vin_pipeline.git"
Issues = "https://github.com/Thundastormgod/paddleocr_vin_pipeline/issues"

[project.scripts]
vin-ocr = "src.vin_ocr.cli:main"
vin-train = "src.vin_ocr.training.cli:main"
vin-evaluate = "src.vin_ocr.evaluation.cli:main"
vin-reproduce = "src.vin_ocr.tracking.reproduce:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-data]
"*" = ["*.yml", "*.yaml", "*.txt", "*.json"]

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | venv
    | _build
    | buck-out
    | build
    | dist
    | PaddleOCR
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip = ["venv", ".venv", "PaddleOCR"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["PaddleOCR", ".venv", "venv"]

[tool.ruff.lint]
# CI GATE (blocking): the critical-correctness subset only - syntax
# errors (E9), invalid prints/comparisons (F63), forward-annotation and
# statement errors (F7xx), undefined names (F82x). Measured 2026-08-22:
# this subset is clean on the working tree and finds exactly one real
# bug on main (see per-file ignore below). Style/modernization rules are
# reported advisorily in CI and enter the gate only after a dedicated
# format-the-tree PR.
select = ["E9", "F63", "F7", "F82"]

[tool.ruff.lint.per-file-ignores]
# F821: `_select_device(...) -> 'torch.device'` references torch, which
# is not imported at module scope. The fix (annotation -> Any) is
# already queued in PR #7 (refactor/providers-pipeline, audit item A1).
# REMOVE this ignore when the stack merges - the gate then enforces
# F821 here too.
"src/vin_ocr/providers/ocr_providers.py" = ["F821"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = ["venv", "PaddleOCR", "tests"]

# Deterministic analysis surface: optional heavy backends are treated as
# untyped (Any) EVERYWHERE, whether or not they happen to be installed.
# Without this, a dev venv with torch/onnxruntime produces errors the CI
# typecheck env (which installs only numpy/cv2/PIL/yaml/rapidfuzz/tqdm/
# paddle/paddleocr/streamlit/mlflow) never sees, and the committed
# mypy-baseline ratchet diverges between machines. Measured 2026-08-22:
# 15 local-only errors from torch/onnxruntime typing before this pin.
[[tool.mypy.overrides]]
module = [
    "torch", "torch.*",
    "torchvision", "torchvision.*",
    "onnx", "onnx.*",
    "onnxruntime", "onnxruntime.*",
    "transformers", "transformers.*",
    "peft", "peft.*",
    "bitsandbytes", "bitsandbytes.*",
    "vllm", "vllm.*",
    "datasets", "datasets.*",
    "optuna", "optuna.*",
    "paddle2onnx", "paddle2onnx.*",
    "dagshub", "dagshub.*",
    "playwright", "playwright.*",
]
follow_imports = "skip"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# -m "not e2e" keeps the default run hermetic; e2e tests need a live Streamlit
# server plus a browser. Run them explicitly with:  pytest -m e2e
addopts = "-v --tb=short -m 'not e2e'"
markers = [
    "e2e: end-to-end browser tests requiring a running Streamlit server on :8501",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
